name: CI
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile saferoom.py
      - name: Version check
        run: |
          v=$(python $GITHUB_WORKSPACE/saferoom.py --version)
          echo "$v"
          echo "$v" | grep -Eq '^saferoom [0-9]+\.[0-9]+\.[0-9]+$'   # exits 0 only for a semver string
      - name: Smoke test (local mode)
        run: |
          git config --global user.email ci@saferoom.local
          git config --global user.name CI
          mkdir /tmp/demo && cd /tmp/demo && git init -q
          printf 'API_KEY=real-secret\nDB_URL=postgres://real@prod/db\n' > .env
          mkdir -p services/api && printf 'NESTED_KEY=real-nested-secret\n' > services/api/.env.production
          printf 'print("hi")\n' > app.py
          git add -A && git commit -qm init
          python $GITHUB_WORKSPACE/saferoom.py init
          grep -q 'sr-dummy' .env.saferoom
          grep -q '# from services/api/.env.production' .env.saferoom
          python $GITHUB_WORKSPACE/saferoom.py run --local -- "cat .env; echo new > new.txt; printf 'AGENT=root\n' > .env; mkdir -p services/api nested/.saferoom; printf 'AGENT=nested\n' > services/api/.env.production; printf hidden > nested/.saferoom/state" | tee out.log
          grep -q 'sr-dummy-secret' out.log          # agent saw dummies, not real creds
          ! grep -q 'real-secret' out.log            # real secret never leaked
          ! grep -q 'real-nested-secret' out.log     # nested secret never leaked either
          python $GITHUB_WORKSPACE/saferoom.py review | grep -q 'new.txt'
          python $GITHUB_WORKSPACE/saferoom.py review | grep -q 'Credentials swapped:.*services/api/\.env.production'
          patch=$(echo .saferoom/sessions/*/changes.patch)
          ! grep -Eq '(^|/)\.env|\.saferoom' "$patch"
          python $GITHUB_WORKSPACE/saferoom.py approve
          test -f new.txt
          grep -q 'real-secret' .env                 # real .env untouched
          grep -q 'real-nested-secret' services/api/.env.production
          test ! -e nested/.saferoom/state
          test -f .saferoom/sessions/*/approvals.jsonl   # approval evidence recorded
          recorded=$(python -c "import glob, json; p = sorted(glob.glob('.saferoom/sessions/*/approvals.jsonl'))[-1]; print(json.loads(open(p).read().splitlines()[-1])['patch_sha256'])")
          test "$recorded" = "$(sha256sum .saferoom/sessions/*/changes.patch | cut -d' ' -f1)"  # evidence hash matches the applied patch
      - name: Reject tampered protected-path patch
        run: |
          mkdir /tmp/tamper && cd /tmp/tamper && git init -q
          printf 'print("safe")\n' > app.py
          git add -A && git commit -qm init
          python $GITHUB_WORKSPACE/saferoom.py init
          python $GITHUB_WORKSPACE/saferoom.py run --local -- "echo reviewed > safe.txt"
          patch=$(echo .saferoom/sessions/*/changes.patch)
          printf '%s\n' 'diff --git a/services/.env.backdoor b/services/.env.backdoor' 'new file mode 100644' '--- /dev/null' '+++ b/services/.env.backdoor' '@@ -0,0 +1 @@' '+SECRET=tampered' >> "$patch"
          if python $GITHUB_WORKSPACE/saferoom.py approve > approve.out 2>&1; then
            echo 'tampered protected-path patch was accepted' >&2
            exit 1
          fi
          grep -q 'patch touches protected path' approve.out
          test ! -e safe.txt
          test ! -e services/.env.backdoor
      - name: Red-team review artifact
        run: |
          mkdir /tmp/redteam && cd /tmp/redteam && git init -q
          printf 'plain\n' > plain.txt
          printf 'spaced\n' > 'file with spaces.txt'
          printf 'old-binary\n' > binary.bin
          git add -A && git commit -qm init
          python $GITHUB_WORKSPACE/saferoom.py init
          python $GITHUB_WORKSPACE/saferoom.py run --local -- "mv plain.txt .env.renamed; printf changed > 'file with spaces.txt'; mkdir nested; ln -s ../plain.txt nested/.env.link; printf '*.masked -diff\n' > .gitattributes; printf masked > secret.masked; printf '\\000\\001changed' > binary.bin"
          patch=$(echo .saferoom/sessions/*/changes.patch)
          report=$(echo .saferoom/sessions/*/report.md)
          ! grep -Eq '\.env\.renamed|nested/\.env\.link' "$patch"
          grep -q 'plain.txt' "$patch"                 # safe side of rename is disclosed
          grep -q 'file with spaces.txt' "$patch"      # quoted path remains reviewable
          grep -q 'GIT binary patch' "$patch"          # full binary payload is retained
          grep -q 'Binary content is encoded' "$report" # ambiguity is prominent
          python $GITHUB_WORKSPACE/saferoom.py approve
          test ! -e plain.txt
          test ! -e .env.renamed
          test ! -e nested/.env.link
          grep -q changed 'file with spaces.txt'
          test -f .gitattributes && test -f secret.masked
      - name: Docker smoke test
        run: |
          mkdir /tmp/demo2 && cd /tmp/demo2 && git init -q
          printf 'API_KEY=real-secret\n' > .env
          mkdir -p services/api && printf 'NESTED_KEY=docker-nested-secret\n' > services/api/.env.production
          git add -A && git commit -qm init
          python $GITHUB_WORKSPACE/saferoom.py init
          python $GITHUB_WORKSPACE/saferoom.py run --offline --image python:3.12-slim -- "echo boxed > box.txt && cat .env; cat services/api/.env.production || echo nested-env-absent" | tee docker.out
          grep -q 'sr-dummy-secret' docker.out           # container saw dummies only
          ! grep -q 'real-secret' docker.out             # root secret never entered container
          ! grep -q 'docker-nested-secret' docker.out    # nested secret never entered container
          grep -q 'nested-env-absent' docker.out         # nested .env deleted before start
          python $GITHUB_WORKSPACE/saferoom.py review | grep -q 'box.txt'
          python $GITHUB_WORKSPACE/saferoom.py review | grep -q 'Credentials swapped:.*services/api/\.env.production'
